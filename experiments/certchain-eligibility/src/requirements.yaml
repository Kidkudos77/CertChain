# FAMU Cyber Defense Certificate — Requirement List
# ==================================================
# FROZEN. Do not modify. Hash recorded in results manifest.
# Source: Florida A&M University, Department of Computer and Information Sciences
#
# Gate logic:
#   eligible = prerequisite_met
#              AND all 5 requirements matched (conjunctive, not compensable)
#              AND every matched course has grade >= C
#
#   The weighted score (0.40*GPA + 0.40*course_completion + 0.20*BERT_confidence)
#   applies PER REQUIREMENT at Tier C only, deciding whether a semantically
#   inferred match is accepted as satisfying that specific requirement.
#   It does NOT govern overall eligibility.
#
#   course_completion counts only Tier A and Tier B satisfied requirements.
#   BERT_confidence = (1/|R|) * sum_r max_c conf(c, r)

certificate: "Cyber Defense Certificate (Cybersecurity Certificate)"
institution: "Florida A&M University"
department: "Computer and Information Sciences"
total_credit_hours: 15
minimum_grade_per_course: "C"
all_requirements_mandatory: true

prerequisite:
