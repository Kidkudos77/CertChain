# T1-NLP Global Configuration
# ============================
# Single source of truth for all seeds, splits, and hyperparameters.
# Every module reads random_seed from here. No bare random calls.

random_seed: 42

# Data split
default_split: 0.8          # 80% train, 20% test
cv_folds: 10                # Stratified k-fold on training portion

# Split sweep (evaluate at each ratio)
split_sweep:
  start: 0.1
  stop: 0.9
  step: 0.1

# Training hyperparameters
training:
  batch_size: 32
  epochs: 20
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_steps: 100
  max_seq_length: 128
  patience: 5               # Early stopping patience

# Model selection
# Options: bert_dsc_bigru, cnn, lstm, cnn_bilstm, cnn_bigru, bert_head
model: "bert_dsc_bigru"

# Embedding selection
# Options: bert, word2vec, glove
embedding: "bert"

# BERT model name (for tokenizer and embeddings)
bert_model_name: "bert-base-uncased"

# Embedding dimensions (for non-BERT embeddings)
word2vec_dim: 300
glove_dim: 300

# Model architecture parameters
cnn:
  kernel_sizes: [3, 5, 7]
  num_filters: 128
  dropout: 0.3

bigru:
  hidden_size: 128
  num_layers: 2
  dropout: 0.3

depthwise_separable_conv:
  kernel_sizes: [3, 5, 7]
  num_filters: 128

# Evaluation
evaluation:
  f1_average: "macro"       # macro-averaged F1
  latency_samples: 100      # Records to time for inference latency
  significance_level: 0.05  # For paired t-test

# Paths (relative to experiments/t1-nlp/)
paths:
  labeled_data: "data/processed/labeled.csv"
  results_dir: "results"
  model_checkpoints: "results/checkpoints"
