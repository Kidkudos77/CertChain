---
# Hyperledger Caliper benchmark config for CertChain (Phase 4 evaluation).
#
# Transaction range (50-500) matches the roadmap's Phase 4 evaluation table.
# Each transaction count is run once for the write path (issueMicroCredential)
# and once for the read path (verifyCredential), so the report shows both
# throughput/latency curves across the same tx range.
#
# workers: 2 clients, matching the roadmap's "2 HEI nodes" benchmark framing
# (two concurrent institutional clients driving load against the network).
test:
  name: CertChain
  description: >-
    Throughput/latency benchmark of the CertChain chaincode
    (issueMicroCredential write path, verifyCredential read path)
    across a 50-500 transaction range.
  workers:
    number: 2
  rounds:
    - label: issueCredential-50
      txNumber: 50
      rateControl:
        type: fixed-load
        opts:
          transactionLoad: 10
      workload:
        module: workloads/issueCredential.js

    - label: issueCredential-100
      txNumber: 100
      rateControl:
        type: fixed-load
        opts:
          transactionLoad: 10
      workload:
        module: workloads/issueCredential.js

    - label: issueCredential-200
      txNumber: 200
      rateControl:
        type: fixed-load
        opts:
          transactionLoad: 10
      workload:
        module: workloads/issueCredential.js

    - label: issueCredential-300
      txNumber: 300
      rateControl:
        type: fixed-load
        opts:
          transactionLoad: 10
      workload:
        module: workloads/issueCredential.js

    - label: issueCredential-400
      txNumber: 400
      rateControl:
        type: fixed-load
        opts:
          transactionLoad: 10
      workload:
        module: workloads/issueCredential.js

    - label: issueCredential-500
      txNumber: 500
      rateControl:
        type: fixed-load
        opts:
          transactionLoad: 10
      workload:
        module: workloads/issueCredential.js

    - label: verifyCredential-50
      txNumber: 50
      rateControl:
        type: fixed-load
        opts:
          transactionLoad: 10
      workload:
        module: workloads/verifyCredential.js
        arguments:
          seedCount: 5

    - label: verifyCredential-100
      txNumber: 100
      rateControl:
        type: fixed-load
        opts:
          transactionLoad: 10
      workload:
        module: workloads/verifyCredential.js
        arguments:
          seedCount: 5

    - label: verifyCredential-200
      txNumber: 200
      rateControl:
        type: fixed-load
        opts:
          transactionLoad: 10
      workload:
        module: workloads/verifyCredential.js
        arguments:
          seedCount: 5

    - label: verifyCredential-300
      txNumber: 300
      rateControl:
        type: fixed-load
        opts:
          transactionLoad: 10
      workload:
        module: workloads/verifyCredential.js
        arguments:
          seedCount: 5

    - label: verifyCredential-400
      txNumber: 400
      rateControl:
        type: fixed-load
        opts:
          transactionLoad: 10
      workload:
        module: workloads/verifyCredential.js
        arguments:
          seedCount: 5

    - label: verifyCredential-500
      txNumber: 500
      rateControl:
        type: fixed-load
        opts:
          transactionLoad: 10
      workload:
        module: workloads/verifyCredential.js
        arguments:
          seedCount: 5

monitors:
  resource:
    - module: process-usage
      options:
        interval: 3
        processes:
          - command: node
            arguments: api/server.js
            multiOutput: avg
